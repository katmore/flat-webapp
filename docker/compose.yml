# Run through docker/bin/serve (see README.md); it sets the variables below.
name: flat-webapp
services:
  web:
    build:
      context: .
      args:
        PHP_INI: ${WEBAPP_PHP_INI:-development}
    image: flat-webapp-web
    ports:
      - "${WEBAPP_PORT:-8080}:80"
    volumes:
      - ..:/var/www/webapp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/view.php/home"]
      interval: 2s
      timeout: 5s
      retries: 20
  composer:
    # PHP dependencies, including flat itself, into ./vendor
    image: composer:2.2@sha256:4c156e03ca848b69528dde30996d8922b47a9946e76d5cc563cf7f0898e8aa86
    profiles: ["tools"]
    user: "${WEBAPP_UID:-1000}:${WEBAPP_GID:-1000}"
    working_dir: /app
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ..:/app
