# Run through docker/bin/serve (see README.md); it sets the variables below.
name: flat-webapp
services:
  web:
    build:
      context: .
    image: flat-webapp-web
    environment:
      APACHE_RUN_USER: "#${WEBAPP_UID:-1000}"
      APACHE_RUN_GROUP: "#${WEBAPP_GID:-1000}"
    ports:
      - "${WEBAPP_PORT:-8080}:80"
    volumes:
      - ..:/var/www/webapp
  composer:
    # PHP dependencies, including flat itself, into ./vendor
    image: composer:2.11@sha256:5b2137f112f939a92788ceb5e55f54859d9dbf467a44037cf7760bdda949f365
    profiles: ["tools"]
    user: "${WEBAPP_UID:-1000}:${WEBAPP_GID:-1000}"
    working_dir: /app
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ..:/app
