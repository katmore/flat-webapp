# Added when WEBAPP_CA_FILE is set: trust an extra CA bundle (for example behind a
# corporate proxy) when Composer and Bower download packages.
services:
  composer:
    environment:
      COMPOSER_CAFILE: /ca.crt
      GIT_SSL_CAINFO: /ca.crt
    volumes:
      - ${WEBAPP_CA_FILE:?}:/ca.crt:ro
  bower:
    environment:
      NODE_EXTRA_CA_CERTS: /ca.crt
      GIT_SSL_CAINFO: /ca.crt
      SSL_CERT_FILE: /ca.crt
    volumes:
      - ${WEBAPP_CA_FILE:?}:/ca.crt:ro
