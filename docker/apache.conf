# The site root is the application's web folder. The same folder is also served
# under /webapp, because the URLs in app/config/flat/App/*.php are written for
# an application installed at http://example.com/webapp/.
# silences Apache's "could not determine the server's fully qualified domain name" notice
ServerName localhost

# PHP maps some error types (deprecations) to a low Apache log level that is hidden
# by default; show everything PHP logs.
LogLevel warn php7:debug

<VirtualHost *:80>
    DocumentRoot /var/www/webapp/web
    Alias /webapp /var/www/webapp/web
    <Directory /var/www/webapp/web>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        # lets /view.php/home and /api.php/Resource reach the script as PATH_INFO
        AcceptPathInfo On
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
